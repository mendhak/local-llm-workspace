services:
  llama-server:
    extends:
      file: ../compose-common.yml
      service: llama-server
    # Nice models: Qwen3.8-27B-Ridge-3.7bpw.gguf (https://huggingface.co/empero-ai/Qwen3.8-27B-Ridge-GGUF)
    command: >
      -m /models/Qwen3.8-27B-Ridge-3.7bpw.gguf 
      --port 8080
      --host 0.0.0.0
      --load-mode none
      --temp 1.0 --top_p 0.95 --top_k 20 --min_p 0.0 --presence_penalty 0.0 --repeat_penalty 1.0
      --fit off
      -ngl 99
      -c 100000
      --cache-type-k q4_0 --cache-type-v q4_0
      --batch-size 512 --ubatch-size 512
      --parallel 1
      --no-mmproj-offload --no-mmproj
      --flash-attn on
      --chat-template-kwargs "{\"reasoning_effort\":\"xhigh\"}"
      --sleep-idle-seconds 300
